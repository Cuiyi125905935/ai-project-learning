name: AI Alchemy Code Quality & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install lightgbm pandas numpy backtrader ruff sonar-scanner

    - name: Step 1: LightGBM Feature Screening Check
      run: |
        echo "Running LightGBM feature importance validation..."
        python -c "import lightgbm as lgb; print('LightGBM environment OK')"
        # In real scenario, run a small script to check feature stability

    - name: Step 2: SonarLint Static Analysis
      run: |
        echo "Running Ruff (SonarLint equivalent) for static analysis..."
        ruff check . --output-format=github

    - name: Step 3: Backtrader Logic Validation
      run: |
        echo "Running Backtrader logic closed-loop check..."
        python Stock-Pattern-Analyzer/refactored_volume_match.py

    - name: Step 4: Dependency Review
      uses: actions/dependency-review-action@v3
      if: github.event_name == 'pull_request'
      with:
        fail-on-severity: moderate
