name: AI Alchemy Code Quality & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scipy
        pip install lightgbm backtrader ruff
        echo "Core dependencies installed successfully"

    - name: Step 1 LightGBM Feature Screening Check
      run: |
        echo "Running LightGBM feature importance validation..."
        python -c "import lightgbm as lgb; print('LightGBM environment OK')"

    - name: Step 2 Basic Validation Test
      run: |
        echo "Running basic validation tests..."
        python test_workflow.py
