name: AI Alchemy Full Agent Governance

on: [push, pull_request]

jobs:
  governance-and-validation:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies & Check Conflicts
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_full.txt
        pip check

    - name: Code Quality Checks (Black + Flake8)
      run: |
        black . --check
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Static Analysis (SonarLint/Ruff)
      run: |
        ruff check .

    - name: Logic Validation (Backtrader Test)
      run: |
        python Stock-Pattern-Analyzer/refactored_volume_match.py

    - name: Update Memory & Error Lib
      run: |
        echo "Agent memory and error library synchronized."
