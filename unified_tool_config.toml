# Unified Tool Configuration for AI Alchemy Agent
# Aligns flake8, black, and ruff to prevent rule conflicts

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[flake8]
max-line-length = 88
extend-ignore = "E203"
exclude = ".git,__pycache__,build,dist"
count = true
statistics = true
